<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="選択肢式バーチャル患者シミュレーションのGitHub Pages向けミニPoC"
    >
    <title>Virtual Patient Mini PoC</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Virtual Patient Simulation</p>
          <h1>仮想患者シミュレーション PoC</h1>
        </div>
        <div class="top-actions" aria-label="操作">
          <button id="exportLogButton" class="icon-text-button" type="button">ログCSV</button>
          <button id="resetButton" class="ghost-button" type="button">最初から</button>
        </div>
      </header>

      <main class="sim-grid">
        <section class="patient-panel" aria-label="患者表示">
          <div class="patient-stage">
            <div class="patient-video" aria-label="仮想患者">
              <div class="patient-portrait" aria-hidden="true">
                <div class="portrait-hair"></div>
                <div class="portrait-face"></div>
                <div class="portrait-body"></div>
              </div>
              <div class="patient-room" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
              </div>
            </div>
            <div class="patient-meta">
              <span id="sceneBadge" class="scene-badge">Opening</span>
              <div>
                <p class="patient-name">Taye Banks 風ミニ症例</p>
                <p id="patientState" class="patient-state">初期状態</p>
              </div>
            </div>
          </div>

          <aside class="feedback-panel" aria-label="フィードバック">
            <div class="panel-heading">
              <h2>Feedback</h2>
              <span id="scoreBadge" class="score-badge">0</span>
            </div>
            <div id="feedbackList" class="feedback-list"></div>
          </aside>
        </section>

        <section class="conversation-panel" aria-label="会話">
          <nav class="tabs" aria-label="表示切替">
            <button class="tab-button active" type="button" data-tab="talk">Talk</button>
            <button class="tab-button" type="button" data-tab="transcript">Transcript</button>
            <button class="tab-button" type="button" data-tab="notes">Notes</button>
          </nav>

          <div id="talkPanel" class="tab-panel active">
            <label class="search-label" for="choiceSearch">Search</label>
            <input id="choiceSearch" class="choice-search" type="search" placeholder="キーワード">
            <div class="scene-header">
              <h2 id="sceneTitle">Opening</h2>
              <p id="scenePrompt">現在の場面</p>
            </div>
            <div id="choiceList" class="choice-list"></div>
          </div>

          <div id="transcriptPanel" class="tab-panel">
            <div id="transcriptList" class="transcript-list"></div>
          </div>

          <div id="notesPanel" class="tab-panel">
            <textarea id="notesInput" class="notes-input" aria-label="メモ"></textarea>
          </div>
        </section>
      </main>

      <div id="responseOverlay" class="response-overlay" aria-hidden="true">
        <div class="response-window" role="dialog" aria-modal="true" aria-labelledby="responseTitle">
          <div class="response-media">
            <div class="media-pulse" aria-hidden="true"></div>
            <p id="responseTitle">選択肢に対する画像や動画などの表示</p>
          </div>
          <div class="response-footer">
            <span id="responseCaption">5秒間の想定表示</span>
            <progress id="responseProgress" value="0" max="5"></progress>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
